# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "slotify"
version = "0.2.3"
description = "Design tool for Minecraft painted-GUI resource packs"
license = "GPL-3.0-or-later"
repository = "https://github.com/giovyx90/Slotify"
edition = "2021"

[lib]
name = "slotify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
