<svg width="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Slotify</title>
<desc>Square icon with a Minecraft-inventory slot grid and one slot highlighted in amber.</desc>
<defs>
<clipPath id="iconClip"><rect x="20" y="20" width="160" height="160" rx="20"/></clipPath>
</defs>

<rect x="20" y="20" width="160" height="160" rx="20" fill="#3B2A1A"/>

<g clip-path="url(#iconClip)">
  <g stroke="#5C4530" stroke-width="4">
    <line x1="73.3" y1="20" x2="73.3" y2="180"/>
    <line x1="126.6" y1="20" x2="126.6" y2="180"/>
    <line x1="20" y1="73.3" x2="180" y2="73.3"/>
    <line x1="20" y1="126.6" x2="180" y2="126.6"/>
  </g>
  <rect x="76" y="76" width="48" height="48" fill="#F0A831"/>
  <rect x="84" y="84" width="32" height="32" fill="#FFC65C"/>
</g>

<rect x="20" y="20" width="160" height="160" rx="20" fill="none" stroke="#1F160C" stroke-width="5"/>
</svg>
